services:
  api:
    build: .
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ASPNETCORE_HTTPS_PORTS=8443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/jensenonline.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
      - Jwt__Key=${JWT_KEY}
    volumes:
      - dbdata:/app/data
      - ./certs:/https:ro

volumes:
  dbdata: